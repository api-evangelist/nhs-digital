- name: Personal Demographics Service - FHIR API
  description: >-
    Access the national NHS patient demographic database. Supports search, retrieval, and update of patient
    records including names, addresses, dates of birth, registered GPs, nominated pharmacies, and NHS
    numbers. Offers application-restricted, healthcare-worker, and patient access tiers.
  image: >-
    https://digital.nhs.uk/binaries/content/gallery/website/about-nhs-digital/nhs-digital-og.png
